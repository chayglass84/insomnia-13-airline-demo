name: Rewards Program
meta:
  id: wrk_4d1b5c9077bd4851ad4c03688371a915
  created: 1790000395642
  modified: 1790002683229
  description: |-
    Mock server for a not-yet-built "Rewards Program" API.

    Story: the backend and frontend devs agreed on this shape in a design
    review, backend hasn't built the real service yet, and frontend is
    building the UI against this mock in the meantime. Point the frontend
    app at http://localhost:7000/bin/mock_1eb2a482e52e4d32b5799b03e9926935
    today (see `rewards_program_mock_client.yaml`'s Base Environment --
    the mock ID has to be in the path, plain localhost:7000 404s); swap it
    for the real service's base URL later with zero code changes if the
    contract holds.

    A few routes use Insomnia's dynamic mocking (Nunjucks templating
    against `req.queryParams`) to return different bodies for the same
    route, e.g. GET /members/MBR123/balance?tier=gold vs no query
    param at all — worth calling out live.

    This is a separate, contrived API from the "Rewards" folder inside the
    Operations collection (that one is the real, already-built
    airline-ops loyalty API — miles credits/redemptions by `ffId`). Don't
    confuse the two in a demo.
