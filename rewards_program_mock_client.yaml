name: Rewards Program (Mock Client)
meta:
  id: wrk_e2ee084566b1ffaa62a21d53f74b1850
  created: 1790002700000
  modified: 1790002700000
  description: |-
    Frontend-side client for the Rewards Program mock server in
    `rewards_program.yaml`. This is the other half of that demo's story:
    a frontend dev builds and runs these requests against the mock at
    `{{ _.base_url }}` while the real backend doesn't exist yet.

    `base_url` includes the mock server's ID (`/bin/mock_.../`) --
    Insomnia's local mock servers route through that path, plain
    `localhost:7000/...` 404s. Start the mock server from Insomnia (or run
    insomnia-mockbin locally, see the README) before sending these.
