  - name: 05 Template Tags - the actual gotcha
    meta:
      id: fld_05a1b2c3d4e5f60718293a4b5c6d7e8f
      created: 1789000000000
      modified: 1789054625166
      sortKey: -1789000000500
      description: >-
        **Read this folder first if a customer reports "Insomnia is eating my
        data".** Nine times out of ten it is this.


        Insomnia renders request bodies through Nunjucks. Two sequences are
        special:


        - `{{ ... }}` - a variable or template tag - `{% ... %}` - a template
        statement


        If your legitimate data contains either, Insomnia tries to evaluate it
        and substitutes it (or fails outright). Nothing is "stripped" - it is
        being interpreted. There is no backslash-escape for this: `\{\{` is
        neither valid JSON nor valid Nunjucks, and sending it produces a body
        the server can't even parse. The one reliable fix, demonstrated in the
        requests below, is:


        Turn off **Settings -> Render Request Body** on that request. No
        escaping needed - every brace goes out exactly as typed.


        Note that single braces `{` `}` are completely fine, which is why normal
        JSON is unaffected.
    children:
      - url: "{{ _.echo_url }}/post"
        name: Curly braces WITH rendering on - watch it disappear
        meta:
          id: req_05aa1122334455667788990011223344
          created: 1789000000000
          modified: 1789000000000
          isPrivate: false
          description: >-
            Rendering is **on**. `single_braces` passes through untouched
            because Nunjucks only reacts to the double forms `{{ }}` / `{% %}`.
            `a_real_variable` is deliberately a real, unescaped variable
            reference, and IS substituted - by design, not as a bug.


            There is no backslash-escape for `{{ }}` in Insomnia's renderer -
            `\{\{` is not valid JSON *or* valid Nunjucks, and sending it
            produces a body the server can't even parse as JSON. If your data
            genuinely contains literal double braces, the supported fix is the
            next request in this folder: turn rendering off.
          sortKey: -1789000000501
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "single_braces": "{ this is fine } and so is {}",
              "a_real_variable": "{{ _.sample_special_value }}"
            }
        headers:
          - name: Content-Type
            value: application/json
            disabled: false
        scripts:
          afterResponse: >-
            const echoed = insomnia.response.json().json;


            insomnia.test('Status is 200', () => {
              insomnia.expect(insomnia.response.code).to.eql(200);
            });


            insomnia.test('Single braces are never touched', () => {
              insomnia.expect(echoed.single_braces).to.eql('{ this is fine } and so is {}');
            });


            insomnia.test('An unescaped variable IS substituted - by design', ()
            => {
              insomnia.expect(echoed.a_real_variable).to.eql('a-b_c,d.e ~!@#$%^&*()');
              insomnia.expect(echoed.a_real_variable).to.not.include('{{');
            });
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.echo_url }}/post"
        name: Curly braces WITH rendering off - the fix
        meta:
          id: req_05bb1122334455667788990011223344
          created: 1789000000000
          modified: 1789000000000
          isPrivate: false
          description: >-
            Identical body, but **Settings -> Render Request Body is off**. No
            escaping needed - every brace goes out exactly as typed, including
            what looks like a variable reference.


            This is the setting to point a customer at when their payload
            genuinely contains `{{ }}` (Handlebars/Jinja templates, Vue
            snippets, Grafana queries, and so on).
          sortKey: -1789000000502
        method: POST
        body:
          mimeType: application/json
          text: >-
            {
              "single_braces": "{ this is fine } and so is {}",
              "double_braces": "{{ this_is_not_substituted }}",
              "statement_syntax": "{% if x %}y{% endif %}",
              "handlebars_template": "Hello {{name}}, your seat is {{seat_number}}",
              "grafana_query": "sum(rate(http_requests_total{job=\"api\"}[5m]))",
              "jsonata": "$.passengers[?(@.seat=='14C')]"
            }
        headers:
          - name: Content-Type
            value: application/json
            disabled: false
        scripts:
          afterResponse: >-
            const echoed = insomnia.response.json().json;


            insomnia.test('Status is 200', () => {
              insomnia.expect(insomnia.response.code).to.eql(200);
            });


            insomnia.test('Double braces are sent verbatim, not substituted', ()
            => {
              insomnia.expect(echoed.double_braces).to.eql('{{ this_is_not_substituted }}');
            });


            insomnia.test('Template statement syntax is sent verbatim', () => {
              insomnia.expect(echoed.statement_syntax).to.eql('{% if x %}y{% endif %}');
            });


            insomnia.test('A Handlebars template survives intact', () => {
              insomnia.expect(echoed.handlebars_template).to.eql('Hello {{name}}, your seat is {{seat_number}}');
            });


            insomnia.test('A PromQL query with braces and brackets survives', ()
            => {
              insomnia.expect(echoed.grafana_query).to.eql('sum(rate(http_requests_total{job="api"}[5m]))');
            });
        settings:
          renderRequestBody: false
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.echo_url }}/post"
        name: Environment variables holding special characters
        meta:
          id: req_05cc1122334455667788990011223344
          created: 1789000000000
          modified: 1789000000000
          isPrivate: false
          description: "Proves the storage layer is clean too: these values live in the
            **Base Environment**, full of punctuation and Unicode, and are
            interpolated into a JSON body. Open the environment editor to see
            them."
          sortKey: -1789000000503
        method: POST
        body:
