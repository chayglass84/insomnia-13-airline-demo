type: collection.insomnia.rest/5.0
schema_version: "5.1"
name: Special Characters
meta:
  id: wrk_5c4a1f0b9d2e4a7b8c6d5e3f2a1b0c9d
  created: 1789000000000
  modified: 1789000000000
  description: >-
    # Special Characters Torture Test


    A collection that pushes punctuation, Unicode, control characters, and
    template-tag syntax through **every field Insomnia exposes**: JSON bodies,
    query params, path params, headers, cookies, form fields, multipart, and
    environment variables.


    ## How to prove it works


    Every request targets an **echo service** (`{{ _.echo_url }}`, default
    `https://httpbin.org`) that reflects exactly what it received. Each request
    has an `afterResponse` test that compares the **echoed value against the
    value that was sent**. Green tests = the bytes survived the round trip
    unchanged.


    Run the whole thing with the **Collection Runner**. If a customer claims
    Insomnia mangles `-`, `_`, or `,`, this is the receipt.


    ## The three things that actually bite people


    Insomnia has no character blocklist. What people usually hit is one of
    these, and all three are demonstrated in folder `05`:


    1. **`{{ ... }}` and `{% ... %}` are template syntax.** If your data
    legitimately
       contains double curly braces, Insomnia tries to render it as a variable and
       either substitutes it or fails outright. There is no backslash-escape for
       this - the fix is to turn off *Settings -> Render Request Body* on that
       request.

    2. **Non-ASCII in HTTP headers.** Header values are latin-1 by the RFC. An
       emoji in a header is an HTTP-level constraint, not an Insomnia one. Fix:
       RFC 8187 (`Header*=UTF-8''...`) or base64.

    3. **URL auto-encoding.** *Settings -> Encode URL* percent-encodes reserved
       characters in the URL. That is correct behavior, but it means the raw URL
       string you typed is not the raw string on the wire. Toggle it off to send
       pre-encoded URLs verbatim.


    ## Swapping the target


    Change `echo_url` in the Base Environment to point at the customer's own API
    if you want to test their stack instead of httpbin.
collection:
  - name: 01 JSON Bodies
    meta:
      id: fld_01a1b2c3d4e5f60718293a4b5c6d7e8f
      created: 1789000000000
      modified: 1789054626777
      sortKey: -1789000000100
      description: JSON request bodies stuffed with punctuation, Unicode, escapes, and
        control characters. Each test asserts the echoed `json` object matches
        what was sent, byte for byte.
    children:
      - url: "{{ _.echo_url }}/post"
        name: ASCII punctuation - every printable symbol
        meta:
          id: req_01aa1122334455667788990011223344
          created: 1789000000000
          modified: 1789000000000
          isPrivate: false
          description: The exact characters the customer named (`-`, `_`, `,`) plus the
            rest of printable ASCII punctuation, in both JSON **keys** and
            **values**.
          sortKey: -1789000000101
        method: POST
        body:
          mimeType: application/json
          text: >-
            {
              "dashes-and_underscores": "a-b_c,d.e",
              "comma,in,key": "one,two,three",
              "quotes": "single ' double \" backtick ` curly \u201cx\u201d \u2018y\u2019",
              "brackets": "(round) [square] <angle>",
              "braces_single": "open { close } both {}",
              "slashes": "forward / back \\ pipe |",
              "math": "+ - * = % ^ ~ < >",
              "shell_metachars": "! @ # $ & * ( ) ; : ? |",
              "punctuation": ". , ; : ! ? ' \" ...",
              "whitespace": "tab\there newline\nhere  double  space",
              "empty_string": "",
              "only_spaces": "   ",
              "sql_looking": "Robert'); DROP TABLE Students;--",
              "html_looking": "<script>alert('xss')</script>",
              "path_looking": "../../etc/passwd",
              "url_looking": "https://a.example/b?c=d&e=f#g",
              "email_looking": "first.last+tag@sub.example.co.uk",
              "money": "$1,234.56 (USD) -12.5%",
              "flight_code": "IA-204_YYZ,LHR"
            }
        headers:
          - name: Content-Type
            value: application/json
            disabled: false
        scripts:
          afterResponse: >-
            const echoed = insomnia.response.json().json;

            const sent = JSON.parse(insomnia.request.body.toString());


            insomnia.test('Status is 200', () => {
              insomnia.expect(insomnia.response.code).to.eql(200);
            });


            insomnia.test('Every key and value survived the round trip', () => {
              insomnia.expect(echoed).to.deep.eql(sent);
            });


            insomnia.test('Dashes, underscores and commas are intact', () => {
              insomnia.expect(echoed['dashes-and_underscores']).to.eql('a-b_c,d.e');
              insomnia.expect(echoed['comma,in,key']).to.eql('one,two,three');
            });


            insomnia.test('Tab and newline are preserved, not stripped', () => {
              insomnia.expect(echoed.whitespace).to.include('\t');
              insomnia.expect(echoed.whitespace).to.include('\n');
            });
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.echo_url }}/post"
        name: Unicode - emoji, CJK, RTL, accents
        meta:
          id: req_01bb1122334455667788990011223344
          created: 1789000000000
          modified: 1789000000000
          isPrivate: false
          description: "Multi-byte UTF-8: emoji (including ZWJ sequences and skin-tone
            modifiers), CJK, right-to-left scripts, combining diacritics, and
            characters outside the Basic Multilingual Plane."
          sortKey: -1789000000102
        method: POST
        body:
          mimeType: application/json
          text: >-
            {
              "emoji_basic": "\u2708\ufe0f \ud83e\uddf3 \ud83c\udf0d \u2705 \u274c",
              "emoji_zwj_family": "\ud83d\udc68\u200d\ud83d\udc69\u200d\ud83d\udc67\u200d\ud83d\udc66",
              "emoji_skin_tone": "\ud83d\udc4b\ud83c\udffd \ud83d\udc69\ud83c\udffe\u200d\u2708\ufe0f",
              "flag_sequence": "\ud83c\udde8\ud83c\udde6 \ud83c\uddec\ud83c\udde7 \ud83c\uddef\ud83c\uddf5",
              "cjk_chinese": "\u591a\u4f26\u591a\u76ae\u5c14\u900a\u56fd\u9645\u673a\u573a",
              "cjk_japanese": "\u6771\u4eac\u56fd\u969b\u7a7a\u6e2f\uff08\u7fbd\u7530\uff09",
              "korean": "\uc778\ucc9c\uad6d\uc81c\uacf5\ud56d",
              "rtl_arabic": "\u0645\u0637\u0627\u0631 \u062f\u0628\u064a \u0627\u0644\u062f\u0648\u0644\u064a",
              "rtl_hebrew": "\u05e0\u05de\u05dc \u05d4\u05ea\u05e2\u05d5\u05e4\u05d4 \u05d1\u05df \u05d2\u05d5\u05e8\u05d9\u05d5\u05df",
              "bidi_mixed": "Gate A-12 \u0645\u0637\u0627\u0631 terminal_3",
              "accents_precomposed": "Montr\u00e9al Z\u00fcrich S\u00e3o Paulo Malm\u00f6",
              "accents_combining": "Montre\u0301al Zu\u0308rich",
              "cyrillic": "\u0428\u0435\u0440\u0435\u043c\u0435\u0442\u044c\u0435\u0432\u043e",
              "greek": "\u0395\u03bb\u03b5\u03c5\u03b8\u03ad\u03c1\u03b9\u03bf\u03c2 \u0392\u03b5\u03bd\u03b9\u03b6\u03ad\u03bb\u03bf\u03c2",
              "thai_no_spaces": "\u0e17\u0e48\u0e32\u0e2d\u0e32\u0e01\u0e32\u0e28\u0e22\u0e32\u0e19\u0e2a\u0e38\u0e27\u0e23\u0e23\u0e13\u0e20\u0e39\u0e21\u0e34",
              "currency": "$ \u20ac \u00a3 \u00a5 \u20b9 \u20a9 \u20bd \u20ba",
              "typography": "en\u2013dash em\u2014dash ellipsis\u2026 bullet\u2022 dagger\u2020",
              "math_symbols": "\u2211 \u220f \u221a \u221e \u2260 \u2264 \u2265 \u00b1 \u00d7 \u00f7",
              "astral_plane": "\ud834\udd1e \ud83d\ude80 \ud840\udc0b",
              "unicode_key_\u2708\ufe0f": "emoji in the key name",
              "\u4e2d\u6587\u952e": "CJK key name"
            }
        headers:
          - name: Content-Type
            value: application/json; charset=utf-8
            disabled: false
        scripts:
          afterResponse: >-
            const echoed = insomnia.response.json().json;

            const sent = JSON.parse(insomnia.request.body.toString());


            insomnia.test('Status is 200', () => {
              insomnia.expect(insomnia.response.code).to.eql(200);
            });


            insomnia.test('All Unicode survived the round trip', () => {
              insomnia.expect(echoed).to.deep.eql(sent);
            });


            insomnia.test('ZWJ emoji sequence is not split into components', ()
            => {
              insomnia.expect(echoed.emoji_zwj_family).to.eql('\u{1F468}\u200D\u{1F469}\u200D\u{1F467}\u200D\u{1F466}');
            });


            insomnia.test('Astral-plane surrogate pairs are intact', () => {
              insomnia.expect([...echoed.astral_plane].length).to.be.above(0);
              insomnia.expect(echoed.astral_plane).to.include('\u{1D11E}');
            });


            insomnia.test('Combining diacritics are NOT silently normalized', ()
            => {
              insomnia.expect(echoed.accents_combining).to.eql('Montre\u0301al Zu\u0308rich');
              insomnia.expect(echoed.accents_combining).to.not.eql(echoed.accents_precomposed);
            });


            insomnia.test('Non-ASCII object keys survived', () => {
              insomnia.expect(Object.keys(echoed)).to.include('\u4E2D\u6587\u952E');
            });
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.echo_url }}/post"
        name: Escapes and control characters
        meta:
          id: req_01cc1122334455667788990011223344
          created: 1789000000000
          modified: 1789000000000
          isPrivate: false
          description: JSON escape sequences, C0 control characters, the zero-width
            family, a BOM, and a lone-surrogate-adjacent replacement char. This
            is where a lossy pipeline usually breaks first.
          sortKey: -1789000000103
        method: POST
        body:
          mimeType: application/json
          text: >-
            {
              "escaped_quote": "she said \"hello\"",
              "escaped_backslash": "C:\\Users\\test\\file.txt",
              "escaped_slash": "a\/b\/c",
              "json_escapes": "\b \f \n \r \t",
              "control_null": "before\u0000after",
              "control_soh": "\u0001\u0002\u0003",
              "control_esc": "\u001b[31mred\u001b[0m",
              "control_del": "\u007f",
              "zero_width_space": "a\u200bb",
              "zero_width_joiner": "a\u200db",
              "zero_width_nonjoiner": "a\u200cb",
              "byte_order_mark": "\ufeffleading BOM",
              "line_separator": "a\u2028b",
              "paragraph_separator": "a\u2029b",
              "nbsp": "non\u00a0breaking\u00a0space",
              "soft_hyphen": "soft\u00adhyphen",
              "replacement_char": "\ufffd",
              "nested_json_string": "{\"looks\":\"like json\",\"but\":\"is a string\"}",
              "escaped_unicode": "\u0041\u0042\u0043"
            }
        headers:
          - name: Content-Type
            value: application/json
            disabled: false
        scripts:
          afterResponse: >-
            const echoed = insomnia.response.json().json;

            const sent = JSON.parse(insomnia.request.body.toString());


            insomnia.test('Status is 200', () => {
              insomnia.expect(insomnia.response.code).to.eql(200);
            });


            insomnia.test('All escapes and control chars survived', () => {
              insomnia.expect(echoed).to.deep.eql(sent);
            });


            insomnia.test('Embedded NUL byte is preserved, not truncated', () =>
            {
              insomnia.expect(echoed.control_null).to.eql('before\u0000after');
              insomnia.expect(echoed.control_null.length).to.eql(12);
            });


            insomnia.test('Zero-width characters were not stripped', () => {
              insomnia.expect(echoed.zero_width_space).to.eql('a\u200Bb');
              insomnia.expect(echoed.zero_width_space.length).to.eql(3);
            });


            insomnia.test('Backslash paths are not double-escaped', () => {
              insomnia.expect(echoed.escaped_backslash).to.eql('C:\\Users\\test\\file.txt');
            });


            insomnia.test('A JSON-looking string stays a string', () => {
              insomnia.expect(echoed.nested_json_string).to.be.a('string');
            });
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.echo_url }}/post"
        name: Realistic airline payload with dirty data
        meta:
          id: req_01dd1122334455667788990011223344
          created: 1789000000000
          modified: 1789000000000
          isPrivate: false
          description: "The customer-shaped case: a plausible booking payload where the
            special characters appear in the places real data actually puts them
            - hyphenated surnames, apostrophes, commas in addresses, plus signs
            in phone numbers and emails, accented city names."
          sortKey: -1789000000104
        method: POST
        body:
          mimeType: application/json
          text: >-
            {
              "pnr": "AB-12_34",
              "contactEmail": "o'brien.smith-jones+booking@sub-domain.example.co.uk",
              "passengers": [
                {
                  "firstName": "Mar\u00eda-Jos\u00e9",
                  "lastName": "O'Brien-Smith",
                  "middleName": "de la Cruz",
                  "phone": "+1 (416) 555-0199 ext. 42",
                  "frequentFlyerId": "FF_1029-384,X",
                  "notes": "Wheelchair req'd; gate-side delivery, seat 14C/14D",
                  "address": "1 King's Road, Apt #5-B, Toronto, ON M5V 1J2, Canada",
                  "passportName": "MARIA-JOSE O BRIEN SMITH"
                },
                {
                  "firstName": "\u5f20",
                  "lastName": "\u4f1f",
                  "phone": "+86-10-1234-5678",
                  "notes": "Meal: \u4e2d\u9910 / vegetarian \u2014 no pork",
                  "address": "\u5317\u4eac\u5e02\u671d\u9633\u533a\u5efa\u56fd\u8def 1 \u53f7"
                }
              ],
              "segments": [
                {
                  "flightNumber": "IA-204",
                  "route": "YYZ->LHR",
                  "departureDate": "2026-05-12T08:30:00-04:00",
                  "travelClass": "Premium/Economy",
                  "fareBasis": "Y1_FLEX-CA,B"
                }
              ],
              "pricing": {
                "base": "$1,234.56",
                "taxes_&_fees": "$187.40",
                "currency": "CAD",
                "discount": "-12.5%",
                "promoCode": "SAVE_20-NOW!"
              },
              "specialRequests": "Aisle seat, please \u2014 traveling w/ infant (0-2 yrs). Contact @ +1-416-555-0199."
            }
        headers:
          - name: Content-Type
            value: application/json
            disabled: false
        scripts:
          afterResponse: >-
            const echoed = insomnia.response.json().json;

            const sent = JSON.parse(insomnia.request.body.toString());


            insomnia.test('Status is 200', () => {
              insomnia.expect(insomnia.response.code).to.eql(200);
            });


            insomnia.test('Booking payload survived the round trip', () => {
              insomnia.expect(echoed).to.deep.eql(sent);
            });


            insomnia.test('Apostrophes and hyphens in names are intact', () => {
              insomnia.expect(echoed.passengers[0].lastName).to.eql("O'Brien-Smith");
              insomnia.expect(echoed.passengers[0].firstName).to.eql('Mar\u00EDa-Jos\u00E9');
            });


            insomnia.test('Plus signs in email and phone are intact', () => {
              insomnia.expect(echoed.contactEmail).to.include('+booking@');
              insomnia.expect(echoed.passengers[0].phone).to.match(/^\+1 \(416\)/);
            });


            insomnia.test('Commas in the address are intact', () => {
              insomnia.expect(echoed.passengers[0].address.split(',').length).to.eql(5);
            });


            insomnia.test('Ampersand in a key name is intact', () => {
              insomnia.expect(echoed.pricing['taxes_&_fees']).to.eql('$187.40');
            });
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
  - name: 02 URLs, Query Params and Paths
    meta:
      id: fld_02a1b2c3d4e5f60718293a4b5c6d7e8f
      created: 1789000000000
      modified: 1789054626244
      sortKey: -1789000000200
      description: "Special characters in the URL itself. The one real behavior to
        know about: **Settings -> Encode URL** percent-encodes reserved
        characters on the way out. That is correct and RFC-compliant, but it
        means the string on the wire differs from the string you typed. The last
        request in this folder turns it off so you can compare."
    children:
      - url: "{{ _.echo_url }}/get"
        name: Query params - reserved and unsafe characters
        meta:
          id: req_02aa1122334455667788990011223344
          created: 1789000000000
          modified: 1789000000000
          isPrivate: false
          description: Every reserved character from RFC 3986 as a query-param value, plus
            spaces, emoji, and characters that look like param delimiters.
          sortKey: -1789000000201
        method: GET
        parameters:
          - name: dashes-and_underscores
            value: a-b_c,d.e
            disabled: false
          - name: comma,in,name
            value: one,two,three
            disabled: false
          - name: reserved
            value: :/?#[]@!$&'()*+,;=
            disabled: false
          - name: spaces
            value: hello world  two spaces
            disabled: false
          - name: plus_sign
            value: a+b (is this a space or a plus?)
            disabled: false
          - name: percent
            value: 100% and a literal %20
            disabled: false
          - name: ampersand_in_value
            value: a&b=c&d
            disabled: false
          - name: quotes
            value: single ' double " backtick `
            disabled: false
          - name: unicode
            value: Montréal ✈️ 多伦多
            disabled: false
          - name: empty_value
            value: ""
            disabled: false
          - name: url_in_a_param
            value: https://other.example/path?x=1&y=2#frag
            disabled: false
        scripts:
          afterResponse: >-
            const args = insomnia.response.json().args;


            insomnia.test('Status is 200', () => {
              insomnia.expect(insomnia.response.code).to.eql(200);
            });


            insomnia.test('Dashes, underscores and commas round trip', () => {
              insomnia.expect(args['dashes-and_underscores']).to.eql('a-b_c,d.e');
              insomnia.expect(args['comma,in,name']).to.eql('one,two,three');
            });


            insomnia.test('All RFC 3986 reserved characters round trip', () => {
              insomnia.expect(args.reserved).to.eql(":/?#[]@!$&'()*+,;=");
            });


            insomnia.test('An ampersand in a value does not split the param', ()
            => {
              insomnia.expect(args.ampersand_in_value).to.eql('a&b=c&d');
            });


            insomnia.test('A plus sign stays a plus, not a space', () => {
              insomnia.expect(args.plus_sign).to.include('a+b');
            });


            insomnia.test('Spaces are preserved exactly', () => {
              insomnia.expect(args.spaces).to.eql('hello world  two spaces');
            });


            insomnia.test('A nested URL with its own query string survives', ()
            => {
              insomnia.expect(args.url_in_a_param).to.eql('https://other.example/path?x=1&y=2#frag');
            });


            insomnia.test('Unicode in query params round trips', () => {
              insomnia.expect(args.unicode).to.eql('Montr\u00E9al \u2708\uFE0F \u591A\u4F26\u591A');
            });
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.echo_url }}/anything/:booking_ref/segments/:route"
        name: Path params with special characters
        meta:
          id: req_02bb1122334455667788990011223344
          created: 1789000000000
          modified: 1789000000000
          isPrivate: false
          description: Path parameters (`:booking_ref`, `:route`) carrying hyphens,
            underscores, commas and a slash. Note that a `/` inside a path param
            value gets percent-encoded to `%2F` so it does not create a new path
            segment - which is exactly what you want.
          sortKey: -1789000000202
        method: GET
        scripts:
          afterResponse: >-
            const body = insomnia.response.json();


            insomnia.test('Status is 200', () => {
              insomnia.expect(insomnia.response.code).to.eql(200);
            });


            insomnia.test('Path param special characters reached the server', ()
            => {
              insomnia.expect(decodeURIComponent(body.url)).to.include('AB-12_34,X');
              insomnia.expect(decodeURIComponent(body.url)).to.include('YYZ-LHR');
            });


            insomnia.test('Path structure was not broken by the values', () => {
              insomnia.expect(body.url).to.include('/segments/');
            });
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
        pathParameters:
          - name: booking_ref
            value: AB-12_34,X
          - name: route
            value: YYZ-LHR
      - url: "{{ _.echo_url }}/get?pre_encoded=a%2Bb%20c%26d&raw=untouched-_,."
        name: Encode URL OFF - send the URL verbatim
        meta:
          id: req_02cc1122334455667788990011223344
          created: 1789000000000
          modified: 1789000000000
          isPrivate: false
          description: >-
            Same idea as the query-param request, but with **Settings -> Encode
            URL turned off**. Insomnia sends the URL string byte-for-byte as
            typed, so `%2B` stays `%2B` instead of being re-encoded to `%252B`.


            **This is the setting to reach for** when a customer says Insomnia
            is "changing" their URL. It is not stripping characters; it is
            encoding them, and this toggle stops it.
          sortKey: -1789000000203
        method: GET
        scripts:
          afterResponse: >-
            const args = insomnia.response.json().args;


            insomnia.test('Status is 200', () => {
              insomnia.expect(insomnia.response.code).to.eql(200);
            });


            insomnia.test('Pre-encoded sequences were NOT double-encoded', () =>
            {
              insomnia.expect(args.pre_encoded).to.eql('a+b c&d');
            });


            insomnia.test('Unreserved punctuation passed through untouched', ()
            => {
              insomnia.expect(args.raw).to.eql('untouched-_,.');
            });
        settings:
          renderRequestBody: true
          encodeUrl: false
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
  - name: 03 Headers and Cookies
    meta:
      id: fld_03a1b2c3d4e5f60718293a4b5c6d7e8f
      created: 1789000000000
      modified: 1789054625885
      sortKey: -1789000000300
      description: Headers are the one place where a real character limit exists, and
        it is **not Insomnia's**. Per RFC 7230 header values are ISO-8859-1;
        there is no defined way to put an emoji in a raw header value. The
        standard answers are RFC 8187 encoding or base64, both demonstrated
        here.
    children:
      - url: "{{ _.echo_url }}/headers"
        name: Header values - safe ASCII punctuation
        meta:
          id: req_03aa1122334455667788990011223344
          created: 1789000000000
          modified: 1789000000000
          isPrivate: false
