          rebuildPath: true
      - url: "{{ _.echo_url }}/post"
        name: Response with HTML and script-looking content
        meta:
          id: req_06bb1122334455667788990011223344
          created: 1789000000000
          modified: 1789000000000
          isPrivate: false
          description: Confirms the response viewer displays markup as **text** rather
            than rendering or escaping it away. Useful when a customer says
            angle brackets "vanish" - check they are not reading a rendered HTML
            preview tab.
          sortKey: -1789000000602
        method: POST
        body:
          mimeType: application/json
          text: >-
            {
              "html": "<div class=\"row\" data-id='7'>Gate&nbsp;A-12 &amp; B-14</div>",
              "script_tag": "<script>alert('not executed')</script>",
              "entities": "&lt; &gt; &amp; &quot; &#39; &copy; &#x2708;",
              "markdown": "# Heading\n- item _one_\n- item **two**\n`code -- here`",
              "xml": "<?xml version=\"1.0\"?><root attr=\"a-b_c\"><child/></root>",
              "regex": "^[A-Z]{2}-\\d{3}_(?:[a-z]+,)*[a-z]+$"
            }
        headers:
          - name: Content-Type
            value: application/json
            disabled: false
        scripts:
          afterResponse: >-
            const echoed = insomnia.response.json().json;

            const sent = JSON.parse(insomnia.request.body.toString());


            insomnia.test('Status is 200', () => {
              insomnia.expect(insomnia.response.code).to.eql(200);
            });


            insomnia.test('Markup round trips unmodified', () => {
              insomnia.expect(echoed).to.deep.eql(sent);
            });


            insomnia.test('Angle brackets are not HTML-escaped', () => {
              insomnia.expect(echoed.script_tag).to.eql("<script>alert('not executed')</script>");
            });


            insomnia.test('HTML entities are not decoded', () => {
              insomnia.expect(echoed.entities).to.include('&amp;');
            });


            insomnia.test('A regex with braces and backslashes survives', () =>
            {
              insomnia.expect(echoed.regex).to.eql('^[A-Z]{2}-\\d{3}_(?:[a-z]+,)*[a-z]+$');
            });
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
