          modified: 1789000000000
          isPrivate: false
          description: The `+`-vs-space ambiguity is the classic form-encoding trap. A
            literal `+` must go on the wire as `%2B` or it is decoded as a
            space. This asserts Insomnia gets that right.
          sortKey: -1789000000401
        method: POST
        body:
          mimeType: application/x-www-form-urlencoded
          params:
            - name: dashes-and_underscores
              value: a-b_c,d.e
              disabled: false
            - name: plus_literal
              value: a+b
              disabled: false
            - name: space_literal
              value: a b
              disabled: false
            - name: ampersand
              value: a&b=c
              disabled: false
            - name: percent
              value: 50% off
              disabled: false
            - name: unicode
              value: Montréal ✈️
              disabled: false
            - name: newline
              value: |-
                line one
                line two
              disabled: false
            - name: key,with,commas
              value: value
              disabled: false
        headers:
          - name: Content-Type
            value: application/x-www-form-urlencoded
            disabled: false
        scripts:
          afterResponse: >-
            const form = insomnia.response.json().form;


            insomnia.test('Status is 200', () => {
              insomnia.expect(insomnia.response.code).to.eql(200);
            });


            insomnia.test('Dashes, underscores and commas round trip', () => {
              insomnia.expect(form['dashes-and_underscores']).to.eql('a-b_c,d.e');
              insomnia.expect(form['key,with,commas']).to.eql('value');
            });


            insomnia.test('A literal plus is NOT decoded as a space', () => {
              insomnia.expect(form.plus_literal).to.eql('a+b');
            });


            insomnia.test('A literal space is NOT decoded as a plus', () => {
              insomnia.expect(form.space_literal).to.eql('a b');
            });


            insomnia.test('An ampersand in a value does not split the field', ()
            => {
              insomnia.expect(form.ampersand).to.eql('a&b=c');
            });


            insomnia.test('Unicode round trips through form encoding', () => {
              insomnia.expect(form.unicode).to.eql('Montr\u00E9al \u2708\uFE0F');
