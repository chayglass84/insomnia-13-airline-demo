            insomnia.test('Punctuation stored in an env var survives', () => {
              insomnia.expect(echoed.from_env_punctuation).to.eql('a-b_c,d.e ~!@#$%^&*()');
            });


            insomnia.test('Unicode stored in an env var survives', () => {
              insomnia.expect(echoed.from_env_unicode).to.eql('Montr\u00E9al \u2708\uFE0F \u591A\u4F26\u591A \u2014 caf\u00E9');
            });


            insomnia.test('A JSON-looking env var is not re-parsed', () => {
              insomnia.expect(echoed.from_env_json_ish).to.eql('{"a":1,"b":[2,3]}');
            });


            insomnia.test('Inline interpolation keeps surrounding text', () => {
              insomnia.expect(echoed.interpolated_inline).to.eql('prefix-a-b_c,d.e ~!@#$%^&*()_suffix');
            });
        settings:
