              "from_env_unicode": "{{ _.sample_unicode_value }}",
              "from_env_json_ish": "{{ _.sample_jsonish_value }}",
              "interpolated_inline": "prefix-{{ _.sample_special_value }}_suffix"
            }
        headers:
          - name: Content-Type
            value: application/json
            disabled: false
