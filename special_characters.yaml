      - url: "{{ _.echo_url }}/headers"
        name: Non-ASCII in headers - the RFC 8187 workaround
        meta:
          id: req_03bb1122334455667788990011223344
          created: 1789000000000
          modified: 1789000000000
          isPrivate: false
          description: |-
            Three ways to move `Montr\u00e9al \u2708\ufe0f` through a header.

            - `X-Raw-Unicode` sends it literally. Behavior here is the transport
              layer's call, not Insomnia's, and it may be mangled or rejected.
            - `X-Encoded*` uses **RFC 8187** (`UTF-8''<percent-encoded>`), the
              standard way to carry non-ASCII in a header. Same mechanism as
              `Content-Disposition; filename*=`.
            - `X-Base64` is the belt-and-braces option.

            The last two are asserted; the raw one is informational.
          sortKey: -1789000000302
        method: GET
        headers:
          - name: X-Raw-Unicode
            value: Montréal ✈️
            disabled: false
          - name: X-Encoded*
            value: UTF-8''Montr%C3%A9al%20%E2%9C%88%EF%B8%8F
            disabled: false
          - name: X-Base64
            value: TW9udHLDqWFsIOKciO+4jw==
            disabled: false
        scripts:
          afterResponse: >-
            const h = insomnia.response.json().headers;


            insomnia.test('Status is 200', () => {
              insomnia.expect(insomnia.response.code).to.eql(200);
            });


            insomnia.test('RFC 8187 encoded header decodes back to the
            original', () => {
              const raw = h['X-Encoded*'];
              const decoded = decodeURIComponent(raw.replace(/^UTF-8''/, ''));
              insomnia.expect(decoded).to.eql('Montr\u00E9al \u2708\uFE0F');
            });


            insomnia.test('Base64 header decodes back to the original', () => {
              const decoded = new TextDecoder().decode(
                Uint8Array.from(atob(h['X-Base64']), c => c.charCodeAt(0))
              );
              insomnia.expect(decoded).to.eql('Montr\u00E9al \u2708\uFE0F');
            });


            console.log('Raw unicode header arrived as:',
            JSON.stringify(h['X-Raw-Unicode']));
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
