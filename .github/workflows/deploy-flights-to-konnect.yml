name: Deploy Flights spec to Kong Konnect API Catalog

# Triggers on any change to flights.yaml (the Insomnia doc wrapping the
# Flights & Airports OpenAPI spec) on the default branch.
on:
  push:
    branches: [master]
    paths:
      - flights.yaml
  workflow_dispatch: {}

env:
  KONNECT_API_BASE: https://us.api.konghq.com
  KONNECT_API_NAME: Insomnia Airlines - Flights

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Old approach (superseded by Inso CLI below, kept for reference):
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.x"
      # - name: Install dependencies
      #   run: pip install pyyaml
      # - name: Extract OpenAPI spec from Insomnia document
      #   run: python3 .github/scripts/extract_openapi_spec.py flights.yaml openapi.json

      - name: Find the ApiSpec id in the Insomnia document
        id: spec_id
        run: |
          set -euo pipefail

          # Inso needs an ApiSpec id (spc_...), not just a file path, to export
          # cleanly — pointing it at the raw flights.yaml file makes it treat
          # the whole Insomnia document (workspace, requests, etc.) as the
          # spec root, which breaks $ref resolution for anything under
          # components/schemas. The id lives at spec.meta.id in the doc, and
          # is stable across edits to the spec content — it only changes if
          # the spec is deleted and recreated in Insomnia — so we look it up
          # here instead of hardcoding it, to avoid a silent break if that
          # ever happens. There's exactly one spc_ id in the file (one
          # ApiSpec per Insomnia document), so a plain grep is enough.
          spec_id=$(grep -oE 'spc_[0-9a-f]+' flights.yaml | head -n1)
          echo "Found ApiSpec id: $spec_id"
          echo "spec_id=$spec_id" >> "$GITHUB_OUTPUT"

      - name: Export OpenAPI spec via Inso CLI
        env:
          SPEC_ID: ${{ steps.spec_id.outputs.spec_id }}
        run: |
          # Inso always writes YAML regardless of the -o extension (tested:
          # asking for openapi.json still produced YAML content), so we name
          # the output file to match what it actually writes.
          docker run --rm -v "$(pwd)":/var/temp kong/inso:latest \
            export spec "$SPEC_ID" \
            -w /var/temp/flights.yaml \
            -o /var/temp/openapi.yaml \
            --ci

      - name: Convert exported spec to JSON
        run: |
          # Konnect's version-create endpoint rejected the YAML content Inso
          # writes ("content must be valid specification", a 400) even
          # though it's valid OAS by spectral's own OAS ruleset — but a JSON
          # rendering of this same spec published fine under the old
          # curl-based workflow, so we convert to JSON to match what's known
          # to work rather than debug Konnect's YAML parsing further.
          python3 -c '
          import datetime, json, yaml

          def default(obj):
              if isinstance(obj, (datetime.date, datetime.datetime)):
                  return obj.isoformat()
              raise TypeError(f"Object of type {obj.__class__.__name__} is not JSON serializable")

          with open("openapi.yaml") as f:
              spec = yaml.safe_load(f)
          with open("openapi.json", "w") as f:
              json.dump(spec, f, default=default)
          '

      - name: Lint the exported OpenAPI spec
        run: |
          # .spectral-flights-demo.yaml is a minimal demo ruleset (extends
          # spectral:oas plus one rule requiring info.contact.url) — see that
          # file for how to make this step pass or fail on demand.
          docker run --rm -v "$(pwd)":/var/temp kong/inso:latest \
            lint spec /var/temp/openapi.yaml \
            --ruleset /var/temp/.spectral-flights-demo.yaml \
            --ci

      # Old approach (superseded by kongctl below, kept for reference): two
      # hand-rolled curl calls, one to find-or-create the API, one to POST a
      # new version. The version POST was create-only, so re-running the
      # workflow without bumping info.version always 409'd ("A version with
      # this version string already exists for this API").
      #
      # - name: Find or create API in Konnect API Catalog
      #   id: api
      #   env:
      #     KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}
      #   run: |
      #     set -euo pipefail
      #     existing_id=$(curl -sS --fail-with-body \
      #       -H "Authorization: Bearer ${KONNECT_TOKEN}" \
      #       -G "${KONNECT_API_BASE}/v3/apis" \
      #       --data-urlencode "filter[name]=${KONNECT_API_NAME}" \
      #       | python3 -c 'import json,sys; d=json.load(sys.stdin); items=d.get("data", []); print(items[0]["id"] if items else "")')
      #     if [ -n "$existing_id" ]; then
      #       echo "api_id=$existing_id" >> "$GITHUB_OUTPUT"
      #     else
      #       new_id=$(curl -sS --fail-with-body \
      #         -H "Authorization: Bearer ${KONNECT_TOKEN}" \
      #         -H "Content-Type: application/json" \
      #         -X POST "${KONNECT_API_BASE}/v3/apis" \
      #         -d "$(python3 -c 'import json,os; print(json.dumps({"name": os.environ["KONNECT_API_NAME"]}))')" \
      #         | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
      #       echo "api_id=$new_id" >> "$GITHUB_OUTPUT"
      #     fi
      #
      # - name: Publish new API version with the OpenAPI spec
      #   env:
      #     KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}
      #     API_ID: ${{ steps.api.outputs.api_id }}
      #   run: |
      #     set -euo pipefail
      #     version=$(grep -m1 '^  version:' openapi.yaml | sed -E "s/^  version:[[:space:]]*//; s/^['\"]//; s/['\"]\$//")
      #     payload=$(VERSION="$version" python3 -c '
      #     import json, os
      #     spec_content = open("openapi.yaml").read()
      #     print(json.dumps({
      #         "version": os.environ["VERSION"],
      #         "spec": {"content": spec_content},
      #     }))
      #     ')
      #     curl -sS --fail-with-body \
      #       -H "Authorization: Bearer ${KONNECT_TOKEN}" \
      #       -H "Content-Type: application/json" \
      #       -X POST "${KONNECT_API_BASE}/v3/apis/${API_ID}/versions" \
      #       -d "$payload"

      - name: Install kongctl
        run: curl -fsSL https://get.konghq.com/kongctl | sh

      - name: Adopt the existing Konnect API into kongctl management
        env:
          KONGCTL_DEFAULT_KONNECT_PAT: ${{ secrets.KONNECT_TOKEN }}
        run: |
          # The Flights API in Konnect was originally created by the old
          # curl steps above, before kongctl was involved. kongctl refuses
          # to touch a resource it doesn't already manage, so without this
          # it tries to CREATE a second API with the same name and Konnect
          # rejects it (409, "API slug must be unique"). Adopting labels the
          # existing API into kongctl's "default" namespace so `apply` below
          # recognizes and updates it instead. Safe to leave in permanently:
          # once adopted, re-adopting into the same namespace is a no-op we
          # don't need to fail the job over, so we swallow any error here.
          kongctl adopt api "${KONNECT_API_NAME}" --namespace default --base-url "${KONNECT_API_BASE}" \
            || echo "Adopt reported an issue (likely already adopted) — continuing."

      - name: DIAGNOSTIC - raw curl POST with the same openapi.json content
        continue-on-error: true
        env:
          KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}
        run: |
          set -euo pipefail
          # Isolating whether Konnect rejects this exact content regardless
          # of client, or whether it's specific to how kongctl sends it.
          # Uses a throwaway version string so it can't collide with
          # anything real. Not meant to stay in the workflow.
          api_id=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer ${KONNECT_TOKEN}" \
            -G "${KONNECT_API_BASE}/v3/apis" \
            --data-urlencode "filter[name]=${KONNECT_API_NAME}" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["data"][0]["id"])')
          echo "api_id=$api_id"
          payload=$(python3 -c '
          import json
          spec_content = open("openapi.json").read()
          print(json.dumps({
              "version": "0.0.1-diagnostic",
              "spec": {"content": spec_content},
          }))
          ')
          curl -sS -w "\nHTTP_STATUS=%{http_code}\n" \
            -H "Authorization: Bearer ${KONNECT_TOKEN}" \
            -H "Content-Type: application/json" \
            -X POST "${KONNECT_API_BASE}/v3/apis/${api_id}/versions" \
            -d "$payload" || true

      - name: Apply Konnect API Catalog config via kongctl
        env:
          KONGCTL_DEFAULT_KONNECT_PAT: ${{ secrets.KONNECT_TOKEN }}
        run: |
          # kongctl is declarative: it diffs kongctl-flights-api.yaml against
          # what's actually in the Konnect API Catalog and applies only the
          # difference (create the API if missing, add/update the version if
          # it differs). That's what fixes the 409 above — re-running with an
          # unchanged version is a no-op instead of a duplicate-create error,
          # and a changed version updates in place instead of needing a
          # separate find-or-create step.
          # --auto-approve skips the interactive confirmation prompt, which
          # would otherwise hang the job in a non-interactive CI shell.
          # --log-level debug temporarily, to see the actual request body
          # kongctl sends — Konnect's 400 doesn't say what's wrong with the
          # content, and the content itself passes strict OAS 3.0 schema
          # validation locally, so something in-transit is suspect.
          kongctl apply -f kongctl-flights-api.yaml --base-url "${KONNECT_API_BASE}" --auto-approve --log-level debug

# ---------------------------------------------------------------------------
# decK vs. kongctl (NOT USED — decK — for reference only):
#
# decK manages Kong Gateway configuration (services, routes, consumers,
# plugins), on-prem or within a single Konnect control plane — it operates
# one layer down from what this workflow needs. The Konnect API Catalog (the
# "APIs" entity kongctl manages above) is a platform-level resource, not
# gateway runtime config, so decK has no equivalent for it. If this API is
# later exposed through a Kong Gateway control plane and you want to sync
# *that* gateway config as code, it would look like:
#
#   - name: Install decK
#     run: |
#       curl -sL https://get.konghq.com/deck | sh -s -- -b /usr/local/bin
#
#   - name: Sync gateway config to Konnect control plane
#     env:
#       DECK_KONNECT_TOKEN: ${{ secrets.KONNECT_TOKEN }}
#     run: |
#       deck gateway sync kong.yaml --konnect-control-plane-name flights-cp
#
# That does NOT create/update an API Catalog entry, so it can't replace the
# kongctl step above for this task.
# ---------------------------------------------------------------------------
