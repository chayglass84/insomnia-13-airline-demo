collection:
  - url: http://localhost:8000/flights/
    name: Flights
    meta:
      id: req_f16a301991e3431fadf233b0c79e06e1
      created: 1788898051681
      modified: 1788898456334
      isPrivate: false
      description: |-
        Use the CSV from https://docs.google.com/spreadsheets/d/1OJ7Jwaq7qlK-DiJNeKSiePgheJkm1k9Z9QuQIF48hoM/edit?gid=0#gid=0

        Column headers need to match environment variable names (hence origin and destination in this case)
      sortKey: -1788898211201
    method: GET
    parameters:
      - name: origin
        value: "{{origin}}"
        disabled: false
      - name: destination
        value: "{{destination}}"
        description: ""
        disabled: false
    scripts:
      afterResponse: >-
        insomnia.test('Status is 200', () =>
        {   insomnia.expect(insomnia.response.code).to.eql(200);

        });

        insomnia.test('Response body is an array', () => {
          const body = insomnia.response.json();
          insomnia.expect(body).to.be.a('array');
        });
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true
